<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Fredrick Mwendwa about web development, software design, or technical consultation.">
  <title>Contact | FutureTech Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <a class="logo" href="index.html">FutureTech<span>.dev</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="registration-form.html">Registration</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>

  <main>
    <section class="section">
      <div class="section-heading">
        <p class="eyebrow">Start a conversation</p>
        <h1>Get in touch</h1>
        <p>Have a project idea or want to talk about technology? Send me a message.</p>
      </div>
      <div class="card form-card">
        <form action="/api/submit" method="POST" class="form" data-form-type="contact">
          <input type="hidden" name="formType" value="contact">
          <div class="form-group">
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" maxlength="120" placeholder="Your name" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" maxlength="254" placeholder="you@example.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" maxlength="5000" placeholder="Tell me a little about what you have in mind..." required></textarea>
          </div>
          <button type="submit" class="btn">Send message</button>
          <p class="form-status" role="status" aria-live="polite" hidden></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 FutureTech · Fredrick Mwendwa</p>
  </footer>
  <script src="forms.js" defer></script>
</body>
</html>
