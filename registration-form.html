<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration | ePortfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">FutureTech<span>.dev</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="registration-form.html" class="active">Registration</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Registration Form Section -->
  <section class="section">
    <h2>Client / Member Registration</h2>
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <form action="#" method="POST" class="form">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="service">Service / Interest</label>
          <select id="service" name="service">
            <option value="web-dev">Web Development</option>
            <option value="software-design">Software Design</option>
            <option value="consultation">Technical Consultation</option>
          </select>
        </div>

        <button type="submit" class="btn">Register Now</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 FutureTech. All rights reserved.</p>
  </footer>

</body>
</html>
